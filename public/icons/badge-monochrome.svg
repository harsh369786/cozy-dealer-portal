<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="BackRest">
  <!--
    Monochrome notification badge for Android. The status bar masks the badge to a solid
    silhouette using the alpha channel, so this is a single flat white glyph on a transparent
    background: a stylised spine (a curved column of vertebra segments), matching the BackRest
    brand mark. Do NOT add color or a filled background — only the alpha shape survives masking.
  -->
  <g fill="#ffffff">
    <!-- Vertebra segments, tapering top to bottom along a gentle curve. -->
    <rect x="42" y="12" width="12" height="7" rx="3" transform="rotate(-8 48 15)"/>
    <rect x="41" y="21" width="14" height="8" rx="3.5" transform="rotate(-5 48 25)"/>
    <rect x="40" y="31" width="16" height="9" rx="4" transform="rotate(-2 48 35)"/>
    <rect x="40" y="42" width="17" height="9" rx="4" transform="rotate(1 48 46)"/>
    <rect x="41" y="53" width="16" height="9" rx="4" transform="rotate(4 48 57)"/>
    <rect x="43" y="64" width="14" height="8" rx="3.5" transform="rotate(7 48 68)"/>
    <rect x="45" y="74" width="12" height="7" rx="3" transform="rotate(9 48 77)"/>
  </g>
</svg>
