# Production deploy: wrangler deploy --env production
# WARNING: the default Worker (no --env) and [env.production] currently share the same D1 id.
# Default ENVIRONMENT is "development" (fixed OTP 123456) for local `vite` / `wrangler dev`.
# Do not run `npm run deploy:staging` against this database. Provision a separate staging D1
# and point the default [[d1_databases]] at it before using a staging Worker on live data.
name = "backrest-pwa"
main = "src/server.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "backrest-db"
database_id = "0960e05b-0400-4450-aecb-a20c315063ca"

[[queues.producers]]
binding = "WHATSAPP_QUEUE"
queue = "whatsapp-outbox"

[[queues.consumers]]
queue = "whatsapp-outbox"
max_batch_size = 10
max_batch_timeout = 30

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = ""
# Gupshup WhatsApp — non-secret config (API key is a SECRET set via `wrangler secret put GUPSHUP_API_KEY`).
# Template IDs are the Gupshup template UUIDs; fill with the approved template IDs from the console.
GUPSHUP_API_BASE_URL = "https://api.gupshup.io"
GUPSHUP_SOURCE = ""
GUPSHUP_SRC_NAME = "Backrest"
GUPSHUP_TEMPLATE_LANG = "en"
GUPSHUP_TEMPLATE_ID_OTP = ""
GUPSHUP_TEMPLATE_ID_ORDER_PLACED = ""
GUPSHUP_TEMPLATE_ID_ORDER_REJECTED = ""
GUPSHUP_TEMPLATE_ID_ORDER_DELIVERED = ""
GUPSHUP_TEMPLATE_ID_CAMPAIGN_LIVE = ""
WHATSAPP_TEST_PHONE = ""

[[ratelimits]]
name = "OTP_IP_RATE_LIMITER"
namespace_id = "10001"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "OTP_PHONE_RATE_LIMITER"
namespace_id = "10002"

[ratelimits.simple]
limit = 3
period = 60

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[env.production]
name = "backrest-pwa"

[[env.production.d1_databases]]
binding = "DB"
database_name = "backrest-db"
database_id = "0960e05b-0400-4450-aecb-a20c315063ca"

[[env.production.queues.producers]]
binding = "WHATSAPP_QUEUE"
queue = "whatsapp-outbox"

[[env.production.queues.consumers]]
queue = "whatsapp-outbox"
max_batch_size = 10
max_batch_timeout = 30

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = ""
GUPSHUP_API_BASE_URL = "https://api.gupshup.io"
GUPSHUP_SOURCE = "918451945853"
GUPSHUP_SRC_NAME = "Backrest"
GUPSHUP_TEMPLATE_LANG = "en"
GUPSHUP_TEMPLATE_ID_OTP = "5b42fca5-fc75-4cfa-81b1-e76fd413ae6e"
GUPSHUP_TEMPLATE_ID_ORDER_PLACED = "0d3527f6-6946-4e4f-823c-b7f3e1e481dd"
GUPSHUP_TEMPLATE_ID_ORDER_REJECTED = "e9750510-577f-4ebf-a028-50769bd76c2b"
GUPSHUP_TEMPLATE_ID_ORDER_DELIVERED = "fd7c47ad-3171-4184-a237-e5b619187ab7"
GUPSHUP_TEMPLATE_ID_CAMPAIGN_LIVE = "6a6a2046-e73b-4f66-b480-b23ffde83ac6"
WHATSAPP_TEST_PHONE = "919821650772"

[[env.production.ratelimits]]
name = "OTP_IP_RATE_LIMITER"
namespace_id = "10001"

[env.production.ratelimits.simple]
limit = 10
period = 60

[[env.production.ratelimits]]
name = "OTP_PHONE_RATE_LIMITER"
namespace_id = "10002"

[env.production.ratelimits.simple]
limit = 3
period = 60
