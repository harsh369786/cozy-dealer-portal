name = "backrest-pwa"
main = "src/server.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "backrest-db"
database_id = "local-backrest-db"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "backrest-assets"

[[queues.producers]]
binding = "WHATSAPP_QUEUE"
queue = "whatsapp-outbox"

[[queues.consumers]]
queue = "whatsapp-outbox"
max_batch_size = 10
max_batch_timeout = 30

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "staging"
